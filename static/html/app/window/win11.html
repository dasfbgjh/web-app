<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Style</title>
    <style>
        :root {
            --bg: #202020;
            --surface: #2d2d2d;
            --mica: rgba(32, 32, 32, 0.85);
            --overlay: #3d3d3d;
            --border: #404040;
            --text: #ffffff;
            --text-secondary: #9e9e9e;
            --accent: #60cdff;
            --close-hover: #c42b1c;
            --window-border: 1px;
        }

        [data-theme="light"] {
            --bg: #f3f3f3;
            --surface: #e8e8e8;
            --mica: rgba(243, 243, 243, 0.85);
            --overlay: #d4d4d4;
            --border: #a6a6a6;
            --text: #1a1a1a;
            --text-secondary: #616161;
            --accent: #005fb8;
            --close-hover: #c42b1c;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
        }

        body {
            width: 100vw;
            height: 100vh;
        }

        * {
            box-sizing: border-box;
        }

        .window {
            width: calc(100% - var(--window-border));
            height: calc(100% - var(--window-border));
            background-color: var(--bg);
            border-radius: 8px;
            border: var(--window-border) solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Segoe UI Variable', 'Segoe UI', sans-serif;
            color: var(--text);
            user-select: none;
        }

        .titlebar {
            height: 32px;
            display: flex;
            align-items: center;
            padding: 0 0 0 12px;
            background: var(--mica);
            backdrop-filter: blur(20px) saturate(125%);
            flex-shrink: 0;
        }

        .titlebar-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            opacity: 0.8;
        }

        .titlebar-title {
            font-size: 12px;
            color: var(--text);
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .titlebar-buttons {
            display: flex;
            height: 100%;
        }

        .titlebar-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: background 0.1s;
        }

        .titlebar-btn:hover {
            background: var(--overlay);
        }

        .titlebar-btn.close:hover {
            background: var(--close-hover);
            color: #fff;
        }

        .titlebar-btn svg {
            width: 10px;
            height: 10px;
            fill: currentColor;
        }

        .theme-toggle {
            width: 32px;
            height: 100%;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: background 0.1s;
        }

        .theme-toggle:hover {
            background: var(--overlay);
        }

        .placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 13px;
            margin: 0px 2px 2px 2px;
        }
    </style>
</head>

<body>
    <div class="window">
        <div class="titlebar">
            <svg class="titlebar-icon" viewBox="0 0 16 16">
                <rect x="1" y="1" width="6" height="6" rx="1" fill="var(--accent)" opacity="0.8" />
                <rect x="9" y="1" width="6" height="6" rx="1" fill="var(--accent)" opacity="0.6" />
                <rect x="1" y="9" width="6" height="6" rx="1" fill="var(--accent)" opacity="0.6" />
                <rect x="9" y="9" width="6" height="6" rx="1" fill="var(--accent)" opacity="0.4" />
            </svg>
            <span class="titlebar-title">Windows 11 Style</span>
            <button class="theme-toggle" title="切换主题">🌙</button>
            <div class="titlebar-buttons">
                <button class="titlebar-btn minimize" title="最小化">
                    <svg viewBox="0 0 10 10">
                        <rect y="4.5" width="10" height="1" />
                    </svg>
                </button>
                <button class="titlebar-btn maximize" title="最大化">
                    <svg viewBox="0 0 10 10">
                        <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1" />
                    </svg>
                </button>
                <button class="titlebar-btn close" title="关闭">
                    <svg viewBox="0 0 10 10">
                        <path d="M0.5 0.5L9.5 9.5M9.5 0.5L0.5 9.5" stroke="currentColor" stroke-width="1.1"
                            fill="none" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="placeholder">Content Placeholder</div>
    </div>

    <script src="window.js"></script>
</body>

</html>
